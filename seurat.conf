# Seurat/1 LAN grade config. Java serves client/dist (or web/ fallback).
http.port=8080
inbox=inbox
works=obras
coverage=cobertura
# Local admin token for PUT/DELETE obras + PUT politica (X-Admin-Token header).
admin.token=cambia-esto
# Voluntary-evict scoring behind session/evict/EvictionPolicy (lru = interim).
eviction.policy=lru
session.max_brushes=1024
rate.bytes_per_s=25000000
